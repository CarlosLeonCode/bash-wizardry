name: Web

on:
  push:
    paths:
      - "web/**"
      - "catalog/**"
      - "tools/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "catalog/**"
      - "tools/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    # packages: read lets npm ci install the private, optional
    # @carlosleoncode/lead-capture from GitHub Packages. Without access (forks,
    # PRs from forks) npm skips it and the build uses the no-op fallback.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
