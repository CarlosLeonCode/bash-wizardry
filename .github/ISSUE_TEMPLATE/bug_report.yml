name: Bug report
description: Something in bash-wizardry doesn't work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security issue?** Please don't file it here: follow [SECURITY.md](https://github.com/CarlosLeonCode/bash-wizardry/security/policy) and report it privately.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, starting from a new terminal if possible.
      placeholder: |
        1. Open a new terminal
        2. cd ~/Dev/my-project
        3. Run `gup`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
      description: What you expected to happen, and what happened instead.
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - zsh
        - bash
    validations:
      required: true

  - type: input
    id: shell-version
    attributes:
      label: Shell version
      description: Output of `zsh --version` or `bash --version` (first line).
      placeholder: zsh 5.9 (arm64-apple-darwin24.0)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.1, Ubuntu 24.04, ...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Installer (curl ... install.sh | bash)
        - Manual (git clone + source init.sh)
    validations:
      required: true

  - type: input
    id: bwiz-version
    attributes:
      label: bwiz version
      description: Output of `bwiz version`.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config.env settings
      description: |
        From the repo's `config.env` and `~/.config/bash-wizardry/config.env`: `BW_AGENT_MODE`, `BW_ALLOW_OVERRIDE`, enabled modules (`BW_ENABLE_*`), and anything else related. Remove paths or values you don't want to share.
      render: shell

  - type: textarea
    id: bw-help
    attributes:
      label: Output of bw-help
      description: If the bug is about a missing or skipped spell, paste the output of `bw-help` (or `bw-help <module>`).
      render: shell

  - type: checkboxes
    id: agent-shell
    attributes:
      label: AI agent shell
      options:
        - label: This happens inside an AI agent's shell (Claude Code, Codex, Cursor, Gemini CLI...).

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any error output. It will be formatted as code automatically.
      render: shell
